[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-speech-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented synthesis claims"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
text-to-speech-claim-audit = "text_to_speech_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["text_to_speech_claim_audit*"]
